<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    /* neutri cu o urma de albastru-ardezie, ca sa stea cu accentul de date */
    --surface-0: #f2f4f7;
    --surface-1: #fbfcfd;
    --surface-2: #e8ebf0;
    --border: #d5dae2;
    --text-primary: #0d1219;
    --text-secondary: #4c5563;
    --text-muted: #78818f;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --grid: #dfe4eb;
    --good: #1baf7a;
    --bad: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #0d1015;
      --surface-1: #161a21;
      --surface-2: #1f242d;
      --border: #2e3540;
      --text-primary: #ffffff;
      --text-secondary: #b6bec9;
      --text-muted: #7f8895;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --grid: #262c35;
      --good: #199e70;
      --bad: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #0d1015;
    --surface-1: #161a21;
    --surface-2: #1f242d;
    --border: #2e3540;
    --text-primary: #ffffff;
    --text-secondary: #b6bec9;
    --text-muted: #7f8895;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --grid: #262c35;
    --good: #199e70;
    --bad: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 72px; }

  header { margin-bottom: 26px; }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: -0.018em; margin: 0 0 5px; text-wrap: balance; }
  .sub { color: var(--text-secondary); font-size: 13.5px; margin: 0; }
  .stamp { color: var(--text-muted); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; margin-top: 9px; font-variant-numeric: tabular-nums; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 13px 15px; margin: 0 0 22px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 11px;

  .filters label { font-size: 12px; color: var(--text-secondary); margin-right: -4px; }
  select, .seg button {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 9px; cursor: pointer;
  }
  select:focus-visible, .seg button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .seg { display: inline-flex; gap: 3px; }
  .seg button[aria-pressed="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .spacer { flex: 1; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 11px; padding: 15px 16px; }
  .tile .k { font-size: 11.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.045em; }
  .tile .v { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 14px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 11px; padding: 17px 18px 13px; min-width: 0; }
  .card.full { grid-column: 1 / -1; }
  .card h2 { font-size: 14.5px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.008em; }
  .card p.note { font-size: 12.2px; color: var(--text-secondary); margin: 0 0 13px; }
  .chart { position: relative; width: 100%; overflow-x: auto; }
  svg { display: block; max-width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; font-size: 12.2px; color: var(--text-secondary); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2.5px; margin-right: 5px; vertical-align: -1px; }

  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12.3px; font-family: "IBM Plex Mono", ui-monospace, monospace; white-space: nowrap; z-index: 5;
    box-shadow: 0 5px 18px rgba(0,0,0,.13); font-variant-numeric: tabular-nums;
  }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }

  table { border-collapse: collapse; width: 100%; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.2px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 9px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 550; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .tablewrap { max-height: 340px; overflow: auto; }

  .banner {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid var(--series-2); border-radius: 9px;
    padding: 12px 15px; margin-bottom: 20px; font-size: 13px; color: var(--text-secondary);
  }
  .banner b { color: var(--text-primary); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 34px 0; text-align: center; }
  footer { margin-top: 30px; color: var(--text-muted); font-size: 12.2px; line-height: 1.65; }
  footer b { color: var(--text-secondary); font-weight: 600; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .card { padding: 14px; } }
</style>

  </div>

</div>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('payload').textContent);
  const rows = DATA.rows || [];
  const $ = (s) => document.querySelector(s);

  const SEG_LABEL = {
    apartament_vanzare: 'Apartamente — vânzare',
    casa_vanzare: 'Case — vânzare',
    teren_vanzare: 'Terenuri — vânzare',
    apartament_chirie: 'Apartamente — chirie',
    casa_chirie: 'Case — chirie',
    auto: 'Autoturisme',
    telefoane: 'Telefoane',
  };
  const isRent = (s) => s.endsWith('_chirie');
  const nf = (v, d = 0) => v == null ? '—' : new Intl.NumberFormat('ro-RO', { maximumFractionDigits: d, minimumFractionDigits: d }).format(v);
  const dLabel = (s) => new Date(s + 'T00:00:00').toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' });

  // ---- filtre -------------------------------------------------------------
  const segs = [...new Set(rows.map(r => r.segment))];
  const zones = [...new Set(rows.map(r => r.zone))].sort((a, b) =>
    a === 'ZMO' ? -1 : b === 'ZMO' ? 1 : a.localeCompare(b, 'ro'));

  // Un watchlist e o zona ca oricare alta, dar numele intern (wl:audi-q7-4m)
  // nu spune nimic in selector — il inlocuim cu eticheta din configuratie.
  const WL = Object.fromEntries((DATA.watchlists || []).map(w => [w.zone, w.label]));
  const zLabel = (z) => {
    if (z === 'ZMO') return 'Zona metropolitană (tot)';
    if (WL[z]) return '★ ' + WL[z];
    const [base, facet] = [z.split('/')[0], z.split('/').slice(1).join('/')];
    if (WL[base]) return '★ ' + WL[base] + ' · ' + facet.replace('=', ': ');
    return z.replace('/', ' · ');
  };

  $('#fSeg').innerHTML = segs.map(s => `<option value="${s}">${SEG_LABEL[s] || s}</option>`).join('');
  $('#fZone').innerHTML = zones.map(z => `<option value="${z}">${zLabel(z)}</option>`).join('');

  const state = { seg: segs[0], zone: zones.includes('ZMO') ? 'ZMO' : zones[0], range: 365, view: 'chart' };

  // ---- primitive de desen -------------------------------------------------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  function axes(svg, W, H, M, xs, yTicks, yFmt) {
    for (const t of yTicks) {
      svg.appendChild(el('line', { x1: M.l, x2: W - M.r, y1: t.y, y2: t.y, stroke: 'var(--grid)', 'stroke-width': 1 }));
      const lb = el('text', { x: M.l - 8, y: t.y + 4, 'text-anchor': 'end', fill: 'var(--text-muted)', 'font-size': 11 });
      lb.textContent = yFmt(t.v); svg.appendChild(lb);
    }
    const step = Math.max(1, Math.ceil(xs.length / 6));
    xs.forEach((d, i) => {
      if (i % step && i !== xs.length - 1) return;
      const t = el('text', { x: M.l + (i / Math.max(1, xs.length - 1)) * (W - M.l - M.r), y: H - M.b + 17,
        'text-anchor': 'middle', fill: 'var(--text-muted)', 'font-size': 11 });
      t.textContent = dLabel(d); svg.appendChild(t);
    });
  }

  function ticks(min, max, n = 4) {
    if (!(max > min)) { max = min + 1; }
    const raw = (max - min) / n;
    const mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
    const out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(v);
    return out.length >= 2 ? out : [min, max];
  }

  /** Grafic de linie, 1-3 serii, cu crosshair + tooltip. */
  function lineChart(host, series, opts = {}) {
    const dates = opts.dates;
    if (!dates.length || series.every(s => s.values.every(v => v == null))) {
      host.innerHTML = '<div class="empty">Date insuficiente pentru această selecție.</div>'; return;
    }
    const W = Math.max(430, host.clientWidth || 470), H = opts.height || 232;
    const M = { t: 12, r: 16, b: 30, l: 54 };
    const all = series.flatMap(s => s.values).filter(v => v != null);
    let lo = Math.min(...all), hi = Math.max(...all);
    if (opts.zeroBased) lo = 0;
    const pad = (hi - lo) * 0.12 || 1;
    lo = opts.zeroBased ? 0 : lo - pad; hi = hi + pad;

    const X = i => M.l + (i / Math.max(1, dates.length - 1)) * (W - M.l - M.r);
    const Y = v => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);

    const wrap = document.createElement('div');
    wrap.className = 'chart';
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img',
      'aria-label': opts.aria || 'grafic de evoluție' });

    axes(svg, W, H, M, dates, ticks(lo, hi).map(v => ({ v, y: Y(v) })), opts.yFmt || (v => nf(v)));

    const endpoints = [];
    series.forEach((s) => {
      let d = '', open = false;
      s.values.forEach((v, i) => {
        if (v == null) { open = false; return; }
        d += (open ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
        open = true;
      });
      svg.appendChild(el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

      const lastI = s.values.reduce((acc, v, i) => v != null ? i : acc, -1);
      if (lastI >= 0) endpoints.push({ s, i: lastI, y: Y(s.values[lastI]) });
    });

    // Etichetare directa la capatul seriei — identitatea nu depinde doar de culoare.
    // Seriile se termina in acelasi punct pe axa X, deci etichetele s-ar suprapune:
    // le impingem pe verticala pana la o distanta minima lizibila.
    if (series.length > 1 && endpoints.length) {
      const GAP = 15;
      endpoints.sort((a, b) => a.y - b.y);
      for (let k = 1; k < endpoints.length; k++) {
        if (endpoints[k].y - endpoints[k - 1].y < GAP) endpoints[k].y = endpoints[k - 1].y + GAP;
      }
      const overflow = endpoints[endpoints.length - 1].y - (H - M.b - 4);
      if (overflow > 0) endpoints.forEach(p => { p.y -= overflow; });
      for (const p of endpoints) {
        const t = el('text', { x: X(p.i) - 4, y: Math.max(M.t + 10, p.y - 6), 'text-anchor': 'end',
          fill: p.s.color, 'font-size': 11, 'font-weight': 600, 'paint-order': 'stroke',
          stroke: 'var(--surface-1)', 'stroke-width': 3.5, 'stroke-linejoin': 'round' });
        t.textContent = p.s.name; svg.appendChild(t);
      }
    }

    const cross = el('line', { y1: M.t, y2: H - M.b, stroke: 'var(--text-muted)', 'stroke-width': 1,
      'stroke-dasharray': '3 3', opacity: 0 });
    svg.appendChild(cross);
    const dots = series.map(s => {
      const c = el('circle', { r: 4, fill: s.color, stroke: 'var(--surface-1)', 'stroke-width': 2, opacity: 0 });
      svg.appendChild(c); return c;
    });

    wrap.appendChild(svg);
    const tip = document.createElement('div'); tip.className = 'tip'; wrap.appendChild(tip);

    svg.addEventListener('pointermove', (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(dates.length - 1, Math.round((px - M.l) / ((W - M.l - M.r) / Math.max(1, dates.length - 1)))));
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
      let html = `<b>${new Date(dates[i] + 'T00:00:00').toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric' })}</b>`;
      series.forEach((s, k) => {
        const v = s.values[i];
        if (v == null) { dots[k].setAttribute('opacity', 0); return; }
        dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', Y(v)); dots[k].setAttribute('opacity', 1);
        html += `<div class="row"><i style="display:inline-block;width:9px;height:9px;border-radius:2.5px;background:${s.color}"></i>${s.name}: <b>${(opts.tipFmt || opts.yFmt || (x => nf(x)))(v)}</b></div>`;
      });
      tip.innerHTML = html; tip.style.opacity = 1;
      const left = (X(i) / W) * r.width;
      tip.style.left = Math.min(r.width - tip.offsetWidth - 6, Math.max(0, left + 12)) + 'px';
      tip.style.top = '6px';
    });
    svg.addEventListener('pointerleave', () => {
      tip.style.opacity = 0; cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0));
    });

    host.innerHTML = '';
    host.appendChild(wrap);
    if (series.length > 1) {
      const lg = document.createElement('div'); lg.className = 'legend';
      lg.innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
      host.appendChild(lg);
    }
  }

  /** Bare orizontale cu etichete directe — pentru comparatia intre cartiere. */
  function barChart(host, items, opts = {}) {
    if (!items.length) { host.innerHTML = '<div class="empty">Date insuficiente.</div>'; return; }
    const W = Math.max(430, host.clientWidth || 470);
    const rowH = 27, M = { t: 6, r: 62, b: 6, l: 128 };
    const H = M.t + items.length * rowH + M.b;
    const max = Math.max(...items.map(i => i.value));
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': opts.aria || '' });
    const wrap = document.createElement('div'); wrap.className = 'chart';

    items.forEach((it, i) => {
      const y = M.t + i * rowH;
      const w = Math.max(2, (it.value / max) * (W - M.l - M.r));
      const lb = el('text', { x: M.l - 10, y: y + 17, 'text-anchor': 'end', fill: 'var(--text-secondary)', 'font-size': 12 });
      lb.textContent = it.label; svg.appendChild(lb);
      svg.appendChild(el('rect', { x: M.l, y: y + 5, width: w, height: 17, rx: 4, fill: opts.color || 'var(--series-1)' }));
      const vl = el('text', { x: M.l + w + 8, y: y + 18, fill: 'var(--text-primary)', 'font-size': 12, 'font-weight': 550 });
      vl.textContent = (opts.fmt || nf)(it.value); svg.appendChild(vl);
      const sub = el('title'); sub.textContent = `${it.label}: ${(opts.fmt || nf)(it.value)}${it.n ? ` (${it.n} anunțuri)` : ''}`;
      svg.appendChild(sub);
    });
    wrap.appendChild(svg); host.innerHTML = ''; host.appendChild(wrap);
  }

  // ---- randare ------------------------------------------------------------
  function pick() {
    let r = rows.filter(x => x.segment === state.seg && x.zone === state.zone);
    r.sort((a, b) => a.date.localeCompare(b.date));
    if (state.range) {
      const cut = new Date(Date.now() - state.range * 864e5).toISOString().slice(0, 10);
      r = r.filter(x => x.date >= cut);
    }
    return r;
  }

  function pctChange(series) {
    const v = series.filter(x => x != null);
    if (v.length < 2) return null;
    return ((v[v.length - 1] - v[0]) / v[0]) * 100;
  }

  function render() {
    const r = pick();
    const dates = r.map(x => x.date);
    const last = r[r.length - 1];
    const rent = isRent(state.seg);
    // Unitatea vine de pe rand, nu din segment: imobiliarele se normalizeaza la
    // suprafata, dar o masina sau un telefon n-au numitor si raman in EUR.
    const perSqm = (last?.unit ?? 'EUR/mp') === 'EUR/mp';
    const unit = !perSqm ? ' €' : rent ? ' €/mp/lună' : ' €/mp';

    // --- tiles
    const flow = r.map(x => x.flowMedianEurSqm);
    const chg = pctChange(flow);
    // cade inapoi pe ultima valoare disponibila: ultima zi poate avea esantion
    // sub prag si atunci e null prin design, nu din lipsa de date
    const lastOf = (key) => { for (let i = r.length - 1; i >= 0; i--) if (r[i][key] != null) return r[i][key]; return null; };
    const headline = lastOf('flowMedianEurSqm') ?? lastOf('stockMedianEurSqm');
    const dom = lastOf('medianDaysOnMarket');
    const yieldPct = DATA.grossYieldPct?.[state.zone];

    $('#tiles').innerHTML = [
      { k: rent ? 'Chirie mediană' : 'Preț median cerut', v: headline != null ? nf(headline) + unit : '—',
        // Pe un watchlist eșantionul e mic prin definiție, iar cifra fără el
        // induce o precizie pe care n-o are — de aceea n-ul stă lângă mediană.
        d: 'cohorta de anunțuri noi, fereastră 30 zile' + (last?.sampleSize != null ? ` · n=${last.sampleSize}` : '') },
      { k: 'Evoluție în perioadă', v: chg == null ? '—' : (chg >= 0 ? '+' : '') + nf(chg, 1) + '%',
        d: 'indicele pe flux, capăt la capăt', cls: chg == null ? '' : chg >= 0 ? 'up' : 'down' },
      { k: 'Anunțuri active', v: last ? nf(last.activeCount) : '—',
        d: last ? `${nf(last.newCount)} noi azi · ${nf(last.delistedCount)} retrase` : '' },
      dom != null
        ? { k: 'Zile pe piață', v: nf(dom), d: 'mediană, anunțuri retrase în 30 zile' }
        : { k: 'Randament brut chirie', v: yieldPct != null ? nf(yieldPct, 2) + '%' : '—', d: 'chirie anuală / preț, aceeași zonă' },
    ].map(t => `<div class="tile"><div class="k">${t.k}</div><div class="v ${t.cls || ''}">${t.v}</div><div class="d">${t.d || ''}</div></div>`).join('');

    // --- charts
    const C = getComputedStyle(document.documentElement);
    const c1 = C.getPropertyValue('--series-1').trim();
    const c2 = C.getPropertyValue('--series-2').trim();
    const c3 = C.getPropertyValue('--series-3').trim();

    $('#charts').innerHTML = `
      <div class="card full">
        <h2>Indicele de preț ${rent ? '(chirie)' : ''}</h2>
        <p class="note">Indicele principal e cel pe <b>flux</b> — mediana anunțurilor noi. Cel pe <b>stoc</b> e adăugat pentru comparație: dacă stocul rămâne în urmă, ce e ieftin se vinde, iar oferta rămasă e mai scumpă decât piața.</p>
        <div id="c1"></div>
      </div>
      <div class="card"><h2>Stoc activ</h2><p class="note">Proprietăți unice listate, după deduplicare cross-portal.</p><div id="c2"></div></div>
      <div class="card"><h2>Ofertă nouă și retrageri</h2><p class="note">Anunțuri apărute și dispărute, mediat pe 7 zile.</p><div id="c3"></div></div>
      <div class="card"><h2>Presiunea pe preț</h2><p class="note">Cât de des se taie prețul și cu cât — semnalul care se mișcă înaintea medianei.</p><div id="c4"></div></div>
      <div class="card"><h2>Preț median pe zonă</h2><p class="note">Ultima zi disponibilă, toate zonele cu eșantion suficient.</p><div id="c5"></div></div>
      ${DATA.macro?.housePriceIndexRO?.length ? `<div class="card full"><h2>Verificare față de indicele oficial</h2><p class="note">Indicele nostru din anunțuri vs. indicele oficial al prețurilor locuințelor (RPPI, Eurostat/INS), ambele indexate la 100 la începutul perioadei. Divergențele susținute înseamnă că prețurile cerute se rup de cele de tranzacție.</p><div id="c6"></div></div>` : ''}
    `;

    lineChart($('#c1'), [
      { name: 'flux (anunțuri noi)', color: c1, values: flow },
      { name: 'stoc activ', color: c2, values: r.map(x => x.stockMedianEurSqm) },
    ], { dates, yFmt: v => nf(v), tipFmt: v => nf(v) + unit, aria: 'evoluția prețului median pe mp' });

    lineChart($('#c2'), [{ name: 'active', color: c1, values: r.map(x => x.activeCount) }],
      { dates, zeroBased: true, height: 190, aria: 'evoluția stocului activ' });

    const smooth = (key) => r.map((_, i) => {
      const w = r.slice(Math.max(0, i - 6), i + 1).map(x => x[key]).filter(v => v != null);
      return w.length ? w.reduce((a, b) => a + b, 0) / w.length : null;
    });
    lineChart($('#c3'), [
      { name: 'noi', color: c1, values: smooth('newCount') },
      { name: 'retrase', color: c2, values: smooth('delistedCount') },
    ], { dates, zeroBased: true, height: 190, yFmt: v => nf(v, 1), aria: 'ofertă nouă și retrageri' });

    lineChart($('#c4'), [
      { name: '% cu preț tăiat', color: c1, values: r.map(x => x.discountShare30d) },
      { name: 'reducere mediană %', color: c3, values: r.map(x => x.medianDiscountPct) },
    ], { dates, zeroBased: true, height: 190, yFmt: v => nf(v, 1) + '%', aria: 'presiunea pe preț' });

    const lastDate = rows.filter(x => x.segment === state.seg).reduce((m, x) => x.date > m ? x.date : m, '');
    const candidates = rows.filter(x => x.segment === state.seg && x.date === lastDate
      && x.zone !== 'ZMO' && x.stockMedianEurSqm != null);
    // Nu punem in acelasi clasament o zona si sub-zonele ei: "Oradea" contine
    // Centru, Rogerius etc., iar alaturarea lor ar compara un intreg cu partile lui.
    const parents = new Set(candidates.map(x => x.zone.split('/')[0]).filter(z =>
      candidates.some(y => y.zone.startsWith(z + '/'))));
    const byZone = candidates
      .filter(x => !parents.has(x.zone))
      .map(x => ({ label: zLabel(x.zone).replace('★ ', '').replace('Oradea · ', ''), value: x.stockMedianEurSqm, n: x.activeCount }))
      .sort((a, b) => b.value - a.value).slice(0, 12);
    barChart($('#c5'), byZone, { fmt: v => nf(v), color: c1, aria: 'preț median pe zonă' });

    if ($('#c6')) {
      const hpi = DATA.macro.housePriceIndexRO;
      const base = flow.find(v => v != null);
      const ours = base ? flow.map(v => v == null ? null : (v / base) * 100) : flow.map(() => null);
      // proiecteaza seria trimestriala oficiala pe axa zilnica
      const off = dates.map(d => {
        const q = `${d.slice(0, 4)}-Q${Math.floor(+d.slice(5, 7) - 1) / 3 + 1 | 0}`;
        return hpi.find(h => h.period === q)?.value ?? null;
      });
      const offBase = off.find(v => v != null);
      lineChart($('#c6'), [
        { name: 'anunțuri (noi)', color: c1, values: ours },
        { name: 'oficial RPPI', color: c2, values: offBase ? off.map(v => v == null ? null : (v / offBase) * 100) : off },
      ], { dates, yFmt: v => nf(v, 0), tipFmt: v => nf(v, 1), aria: 'comparație cu indicele oficial' });
    }

    // --- table
    const cols = [['date', 'Data'], ['activeCount', 'Active'], ['newCount', 'Noi'], ['delistedCount', 'Retrase'],
      ['flowMedianEurSqm', 'Flux €/mp'], ['stockMedianEurSqm', 'Stoc €/mp'], ['p25EurSqm', 'P25'], ['p75EurSqm', 'P75'],
      ['medianPriceEur', 'Preț median €'], ['medianDaysOnMarket', 'Zile'], ['discountShare30d', '% tăieri'],
      ['absorptionRate', 'Absorbție %'], ['sampleSize', 'n']];
    $('#tbl').innerHTML =
      `<thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>` +
      `<tbody>${[...r].reverse().map(x => `<tr>${cols.map(c =>
        `<td>${c[0] === 'date' ? x.date : x[c[0]] == null ? '' : nf(x[c[0]], Number.isInteger(x[c[0]]) ? 0 : 1)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  }

  // ---- interactiune -------------------------------------------------------
  $('#fSeg').onchange = e => { state.seg = e.target.value; render(); };
  $('#fZone').onchange = e => { state.zone = e.target.value; render(); };
  $('#fRange').onchange = e => { state.range = +e.target.value; render(); };
  $('#bChart').onclick = () => setView('chart');
  $('#bTable').onclick = () => setView('table');
  function setView(v) {
    state.view = v;
    $('#bChart').setAttribute('aria-pressed', v === 'chart');
    $('#bTable').setAttribute('aria-pressed', v === 'table');
    $('#viewChart').hidden = v !== 'chart';
    $('#viewTable').hidden = v !== 'table';
  }

  const cov = DATA.coverage || {};
  $('#stamp').textContent =
    `${nf(cov.properties)} proprietăți unice · ${cov.start} → ${cov.end} · ${nf(cov.zones)} zone · ` +
    `actualizat ${new Date(DATA.generatedAt).toLocaleString('ro-RO', { dateStyle: 'medium', timeStyle: 'short' })}`;

  const fx = DATA.macro?.bnrFx;
  $('#foot').innerHTML =
    `<b>Cum se citesc cifrele.</b> Sunt prețuri <b>cerute</b> din anunțuri publice, nu prețuri de tranzacție — ` +
    `în România diferența e tipic 5–15%. Indicele principal se calculează pe cohorta de anunțuri noi, nu pe stocul activ, ` +
    `pentru că stocul se scumpește artificial în timp: ce e ieftin se vinde primul și rămâne ce e scump. ` +
    `Duplicatele cross-portal sunt grupate, suprafețele aduse la „utilă", iar prețurile convertite la cursul BNR` +
    (fx?.eurRon ? ` (${nf(fx.eurRon, 4)} RON/EUR, ${fx.date})` : '') + `. ` +
    `Celulele cu sub 5 observații sunt raportate ca lipsă, nu estimate.` +
    `<br><br>Surse: OLX, Storia, Publi24, Imobiliare.ro, imoRadar24 · Eurostat/INS (RPPI), BNR (curs), ANCPI (tranzacții Bihor).`;

  render();
  window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 180); });
})();
</script>
